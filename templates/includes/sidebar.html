{% load static %}

<nav id="sidebarMenu" class="sidebar d-lg-block bg-dark text-white collapse" data-simplebar>
  <div class="sidebar-inner px-4 pt-3">

    <div class="user-card d-flex d-md-none align-items-center justify-content-between justify-content-md-center pb-4">
      <div class="d-flex align-items-center">
        <div class="avatar-lg me-3">
          <img src="{% static 'assets/img/team/profile-picture-3.jpg' %}"
               class="card-img-top rounded-circle border-white"
               alt="User avatar">
        </div>
        <div class="d-block">
          <h2 class="h5 mb-1">Hi, {{ request.user.username|default:"User" }}</h2>
          <a href="{% url 'logout' %}" class="btn btn-secondary btn-sm d-inline-flex align-items-center">
            <svg class="icon icon-xs me-2" fill="currentColor" viewBox="0 0 20 20"
                 xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd"
                    d="M3 3a1 1 0 011-1h6a1 1 0 110 2H5v12h5a1 1 0 110 2H4a1 1 0 01-1-1V3zm9.293 3.293a1 1 0 011.414 0L18 10.586l-4.293 4.293a1 1 0 01-1.414-1.414L14.586 11H9a1 1 0 110-2h5.586l-2.293-2.293a1 1 0 010-1.414z"
                    clip-rule="evenodd"></path>
            </svg>
            <span>Sign Out</span>
          </a>
        </div>
      </div>
    </div>

    <ul class="nav flex-column pt-3 pt-md-0">
      <li class="nav-item">
        <a href="{% url 'tasks:task-list' %}" class="nav-link d-flex align-items-center">
          <span class="sidebar-icon">
            <img src="{% static 'assets/img/brand/light.svg' %}"
                 height="20" width="20" alt="Volt Logo">
          </span>
          <span class="mt-1 ms-1 sidebar-text">Task Manager</span>
        </a>
      </li>

      <li class="nav-item mt-4 mb-2">
        <span class="sidebar-label text-uppercase text-muted small">
          Tasks
        </span>
      </li>

      <li class="nav-item">
        <a href="{% url 'tasks:task-list' %}" class="nav-link">
          <span class="sidebar-icon">
            <span class="fas fa-list-ul"></span>
          </span>
          <span class="sidebar-text">All tasks</span>
        </a>
      </li>

      <li class="nav-item">
        <a href="{% url 'tasks:my-tasks' %}" class="nav-link">
          <span class="sidebar-icon">
            <span class="fas fa-user-check"></span>
          </span>
          <span class="sidebar-text">My tasks</span>
        </a>
      </li>
    </ul>

  </div>
</nav>
